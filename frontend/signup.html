<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Sneaker Price Comparison</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; background-color: #28a745; }
        button:hover { background-color: #218838; }
        .link { margin-top: 15px; display: block; color: #007bff; text-decoration: none; font-size: 14px; }
        .link:hover { text-decoration: underline; }
        .msg { margin-top: 15px; display: block; color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Sign Up</h2>
        <form onsubmit="executeSignup(event)">
            <input type="text" id="username" placeholder="Choose a Username" required>
            <input type="password" id="password" placeholder="Choose a Password" required>
            <button type="submit">Create Account</button>
        </form>
        <a href="login.html" class="link">Already have an account? Log in</a>
        <a href="index.html" class="link" style="color: #6c757d;">Return to Home</a>
        <span id="authStatus" class="msg"></span>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        async function executeSignup(event) {
            if (event) event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const status = document.getElementById('authStatus');

            try {
                const res = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username || username);
                    window.location.href = 'index.html';
                    return;
                }

                if (status) status.textContent = data.error || 'Signup failed.';
            } catch (err) {
                if (status) status.textContent = 'Backend unreachable on port 5000.';
            }
        }
    </script>
</body>
</html>
