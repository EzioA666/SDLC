<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Sneaker Price Comparison</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; background-color: #17a2b8; }
        button:hover { background-color: #138496; }
        .link { margin-top: 15px; display: block; color: #007bff; text-decoration: none; font-size: 14px; }
        .link:hover { text-decoration: underline; }
        .msg { margin-top: 15px; display: block; color: #dc3545; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Log In</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="executeLogin()">Log In</button>
        <a href="signup.html" class="link">Don't have an account? Sign up</a>
        <a href="index.html" class="link" style="color: #6c757d;">Return to Home</a>
        <span id="authStatus" class="msg"></span>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        async function executeLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const status = document.getElementById('authStatus');

            if (!user || !pass) {
                status.innerText = "Credentials required.";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', user);
                    window.location.href = 'index.html';
                } else {
                    status.innerText = data.error;
                }
            } catch (error) {
                status.innerText = "Backend connection failed.";
            }
        }
    </script>
</body>
</html>
